services:
  database:
    image: ${PHASE8_DATABASE_IMAGE:-mysql:8.0}
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - database_data:/var/lib/mysql

  wordpress:
    image: ${PHASE8_WORDPRESS_IMAGE:-wordpress:6.6.2-php8.2-apache}
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
      WP_ENVIRONMENT_TYPE: local
    ports:
      - "${PHASE8_PORT:-18080}:80"
    volumes:
      - wordpress_data:/var/www/html

  wp-cli:
    image: ${PHASE8_WP_CLI_IMAGE:-wordpress:cli-2.11.0-php8.2}
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WP_ENVIRONMENT_TYPE: local
    entrypoint: ["wp"]
    volumes:
      - wordpress_data:/var/www/html
      - ../dist:/dist:ro
      - ../tools:/tools:ro

volumes:
  database_data:
  wordpress_data:
