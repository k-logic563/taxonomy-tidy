services:
  database:
    environment:
      MYSQL_DATABASE: term_steward_e2e
  wordpress:
    environment:
      WORDPRESS_DB_NAME: term_steward_e2e
      WP_ENVIRONMENT_TYPE: local
    ports: !override
      - "${E2E_PORT:-8081}:80"
  wp-cli:
    environment:
      WORDPRESS_DB_NAME: term_steward_e2e
      WP_ENVIRONMENT_TYPE: local
